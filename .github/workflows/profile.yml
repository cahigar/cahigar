name: Actualizar portada

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  push:
    branches: [main]
    paths:
      - "profile/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portada
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generar tarjetas, panel y actividad
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/build-profile.mjs

      - name: Guardar cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md assets/generated
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "🤖 Portada actualizada automáticamente"
            git push
          fi
