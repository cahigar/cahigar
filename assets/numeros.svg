<line x1="720" x2="720" y1="40" y2="130" stroke="#1e293b"/>
<g clip-path="url(#win)"><g class="roll" style="animation-delay:0.60s;--to:-224px" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#34d399" filter="url(#n)"><text x="1080" y="86" text-anchor="middle">0</text><text x="1080" y="142" text-anchor="middle">1</text><text x="1080" y="198" text-anchor="middle">2</text><text x="1080" y="254" text-anchor="middle">2</text><text x="1080" y="310" text-anchor="middle">3</text></g></g>
