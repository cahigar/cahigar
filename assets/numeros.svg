  <text x="600" y="156" text-anchor="middle" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#64748b" font-style="italic">Técnico de base · Docente por vocación · Builder por naturaleza</text>
