<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="+10 años de experiencia, +200 alumnos tutorizados, +8 proyectos activos, 5 sectores, 3 matrículas de honor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1024"/><stop offset=".5" stop-color="#0e1330"/><stop offset="1" stop-color="#0b1024"/></linearGradient>
    <clipPath id="win"><rect x="0" y="38" width="1200" height="56"/></clipPath>
    <filter id="n"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes roll{from{transform:translateY(0)}to{transform:translateY(var(--to))}} .roll{animation:roll 1.8s cubic-bezier(.2,.8,.2,1) both}</style>
  </defs>
  <rect x="1" y="1" width="1198" height="168" rx="18" fill="url(#bg)" stroke="#1e293b"/>
  <text x="32" y="26" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#22d3ee" letter-spacing="2">// FICHA DE PERSONAJE</text>
  <g clip-path="url(#win)"><g class="roll" style="animation-delay:0.00s;--to:-224px" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#22d3ee" filter="url(#n)"><text x="120" y="86" text-anchor="middle">+3</text><text x="120" y="142" text-anchor="middle">+6</text><text x="120" y="198" text-anchor="middle">+8</text><text x="120" y="254" text-anchor="middle">+9</text><text x="120" y="310" text-anchor="middle">+10</text></g></g>
