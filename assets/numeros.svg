<g clip-path="url(#win)"><g class="roll" style="animation-delay:0.15s;--to:-224px" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="800" fill="#a78bfa" filter="url(#n)"><text x="360" y="86" text-anchor="middle">+40</text><text x="360" y="142" text-anchor="middle">+90</text><text x="360" y="198" text-anchor="middle">+150</text><text x="360" y="254" text-anchor="middle">+180</text><text x="360" y="310" text-anchor="middle">+200</text></g></g>
