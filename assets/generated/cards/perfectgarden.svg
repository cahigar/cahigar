<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Perfect Garden!">
  <defs>
    <linearGradient id="cperfectgardenbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="cperfectgardenedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635" stop-opacity="0"/><stop offset=".5" stop-color="#a3e635"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cperfectgardenglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#a3e635" stop-opacity=".22"/><stop offset="1" stop-color="#a3e635" stop-opacity="0"/></radialGradient>
    <filter id="cperfectgardenn"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes cperfectgardenin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .cperfectgardena{animation:cperfectgardenin .8s ease-out both} .cperfectgardenb{animation:cperfectgardenin .8s ease-out .2s both} .cperfectgardenc{animation:cperfectgardenin .8s ease-out .4s both}</style>
  </defs>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cperfectgardenbg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cperfectgardenglow)"/>
  <rect x="24" y="1" width="512" height="2" fill="url(#cperfectgardenedge)"/>
  <g transform="translate(28 26)"><g class="cperfectgardena" filter="url(#cperfectgardenn)"><g fill="none" stroke="#a3e635" stroke-width="2"><rect x="4" y="4" width="40" height="40" rx="4" stroke-opacity=".5"/><path d="M4 18 H44 M4 31 H44 M18 4 V44 M31 4 V44" stroke-opacity=".35"/><circle cx="11" cy="11" r="4"/><path d="M24 30 V20 M24 24 C20 22 19 18 20 16 C23 17 25 20 24 24 Z"/><path d="M37 37 l-3 -3 h6 z" fill="#a3e635"/></g></g></g>
  <g class="cperfectgardena">
    <text x="92" y="52" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Perfect Garden!</text>
    <text x="92" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a3e635">Libro de puzles + Puzzle Garden Builder</text>
  </g>
  <rect x="407.2" y="28" width="124.8" height="22" rx="11" fill="#a3e635" fill-opacity=".14" stroke="#a3e635" stroke-opacity=".6"/>
  <text x="469.6" y="43" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#a3e635">EN DESARROLLO</text>
  <g class="cperfectgardenb" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="28" y="110">Puzles de lógica de jardines con misiones de hasta tres</text>
    <text x="28" y="131">estrellas. Detrás, una herramienta propia que crea mapas, valida</text>
    <text x="28" y="152">soluciones con CP-SAT y exporta las páginas del libro.</text>
  </g>
  <g class="cperfectgardenc"><rect x="28" y="200" width="59" height="24" rx="12" fill="#a3e635" fill-opacity=".10" stroke="#a3e635" stroke-opacity=".45"/><text x="57.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">React</text><rect x="95" y="200" width="74" height="24" rx="12" fill="#a3e635" fill-opacity=".10" stroke="#a3e635" stroke-opacity=".45"/><text x="132" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">FastAPI</text><rect x="177" y="200" width="81" height="24" rx="12" fill="#a3e635" fill-opacity=".10" stroke="#a3e635" stroke-opacity=".45"/><text x="217.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">OR-Tools</text><rect x="266" y="200" width="66" height="24" rx="12" fill="#a3e635" fill-opacity=".10" stroke="#a3e635" stroke-opacity=".45"/><text x="299" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">CP-SAT</text></g>
  <text x="532" y="254" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748b"></text>
</svg>
