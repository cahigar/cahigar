<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Prismas">
  <defs>
    <linearGradient id="cprismasbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="cprismasedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/><stop offset=".5" stop-color="#f472b6"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cprismasglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#f472b6" stop-opacity=".22"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <filter id="cprismasn"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes cprismasin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .cprismasa{animation:cprismasin .8s ease-out both} .cprismasb{animation:cprismasin .8s ease-out .2s both} .cprismasc{animation:cprismasin .8s ease-out .4s both}</style>
  </defs>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cprismasbg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cprismasglow)"/>
  <rect x="24" y="1" width="512" height="2" fill="url(#cprismasedge)"/>
  <g transform="translate(28 26)"><g class="cprismasa" filter="url(#cprismasn)"><g fill="none" stroke-width="2"><path d="M24 4 L44 40 L4 40 Z" stroke="#f472b6"/><path d="M0 24 L18 24" stroke="#e2e8f0"/><path d="M30 22 L48 14" stroke="#22d3ee"/><path d="M31 25 L48 25" stroke="#a78bfa"/><path d="M30 28 L48 36" stroke="#f472b6"/></g></g></g>
  <g class="cprismasa">
    <text x="92" y="52" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Prismas</text>
    <text x="92" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#f472b6">Presentaciones vivas para docencia técnica</text>
  </g>
  <rect x="414.8" y="28" width="117.19999999999999" height="22" rx="11" fill="#f472b6" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/>
  <text x="473.4" y="43" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#f472b6">DEMO EN VIVO</text>
  <g class="cprismasb" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="28" y="110">Python que se ejecuta en la diapositiva, encuestas y lluvia de</text>
    <text x="28" y="131">ideas en directo y edición con IA. Cada clase se exporta como un</text>
    <text x="28" y="152">único HTML. Demo: unidad real de 118 diapositivas.</text>
  </g>
  <g class="cprismasc"><rect x="28" y="200" width="59" height="24" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".45"/><text x="57.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">React</text><rect x="95" y="200" width="96" height="24" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".45"/><text x="143" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">TypeScript</text><rect x="199" y="200" width="74" height="24" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".45"/><text x="236" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Pyodide</text><rect x="281" y="200" width="118" height="24" rx="12" fill="#f472b6" fill-opacity=".10" stroke="#f472b6" stroke-opacity=".45"/><text x="340" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">IA generativa</text></g>
  <text x="532" y="254" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748b"></text>
</svg>
