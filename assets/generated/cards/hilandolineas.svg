<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Hilando Líneas">
  <defs>
    <linearGradient id="chilandolineasbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="chilandolineasedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="chilandolineasglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#34d399" stop-opacity=".22"/><stop offset="1" stop-color="#34d399" stop-opacity="0"/></radialGradient>
    <filter id="chilandolineasn"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes chilandolineasin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .chilandolineasa{animation:chilandolineasin .8s ease-out both} .chilandolineasb{animation:chilandolineasin .8s ease-out .2s both} .chilandolineasc{animation:chilandolineasin .8s ease-out .4s both}</style>
  </defs>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#chilandolineasbg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#chilandolineasglow)"/>
  <rect x="24" y="1" width="512" height="2" fill="url(#chilandolineasedge)"/>
  <g transform="translate(28 26)"><g class="chilandolineasa" filter="url(#chilandolineasn)"><g fill="none" stroke="#34d399" stroke-width="2"><path d="M6 10 H42 M6 20 H34 M6 30 H40 M6 40 H26"/><path d="M34 36 C40 30 46 38 40 44 C36 48 30 44 34 36 Z" stroke-opacity=".8"/></g></g></g>
  <g class="chilandolineasa">
    <text x="92" y="52" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Hilando Líneas</text>
    <text x="92" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#34d399">Juego diario de comprensión lectora</text>
  </g>
  <rect x="460.4" y="28" width="71.6" height="22" rx="11" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/>
  <text x="496.2" y="43" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#34d399">ONLINE</text>
  <g class="chilandolineasb" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="28" y="110">Cada día, una historia breve y cinco retos (Detective, El telar,</text>
    <text x="28" y="131">La página que falta, Caza la contradicción, La galería). Gratis,</text>
    <text x="28" y="152">sin registro y con recursos para docentes.</text>
  </g>
  <g class="chilandolineasc"><rect x="28" y="200" width="96" height="24" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".45"/><text x="76" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">JavaScript</text><rect x="132" y="200" width="111" height="24" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".45"/><text x="187.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Juego diario</text><rect x="251" y="200" width="74" height="24" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".45"/><text x="288" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Lectura</text><rect x="333" y="200" width="89" height="24" rx="12" fill="#34d399" fill-opacity=".10" stroke="#34d399" stroke-opacity=".45"/><text x="377.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Educación</text></g>
  <text x="532" y="254" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748b"></text>
</svg>
