<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Nights Lord .io">
  <defs>
    <linearGradient id="cnightslordbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="cnightslordedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0"/><stop offset=".5" stop-color="#fb7185"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cnightslordglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#fb7185" stop-opacity=".22"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/></radialGradient>
    <filter id="cnightslordn"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes cnightslordin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .cnightslorda{animation:cnightslordin .8s ease-out both} .cnightslordb{animation:cnightslordin .8s ease-out .2s both} .cnightslordc{animation:cnightslordin .8s ease-out .4s both}</style>
  </defs>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cnightslordbg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cnightslordglow)"/>
  <rect x="24" y="1" width="512" height="2" fill="url(#cnightslordedge)"/>
  <g transform="translate(28 26)"><g class="cnightslorda" filter="url(#cnightslordn)"><g fill="none" stroke="#fb7185" stroke-width="2" stroke-linejoin="round"><path d="M24 30 L20 22 L22 16 L24 20 L26 16 L28 22 Z"/><path d="M20 22 C14 14 6 16 2 20 C8 22 8 28 10 30 C14 26 18 28 24 30 C30 28 34 26 38 30 C40 28 40 22 46 20 C42 16 34 14 28 22"/></g></g></g>
  <g class="cnightslorda">
    <text x="92" y="52" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Nights Lord .io</text>
    <text x="92" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#fb7185">Motor multijugador 100 % procedural</text>
  </g>
  <rect x="422.4" y="28" width="109.6" height="22" rx="11" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".6"/>
  <text x="477.2" y="43" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#fb7185">OPEN SOURCE</text>
  <g class="cnightslordb" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="28" y="110">Servidor autoritativo en Node y cliente Canvas sin motor.</text>
    <text x="28" y="131">Sprites, mapas, iluminación nocturna y sonido generados por</text>
    <text x="28" y="152">código: no hay ni un fichero de imagen.</text>
  </g>
  <g class="cnightslordc"><rect x="28" y="200" width="96" height="24" rx="12" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="76" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">TypeScript</text><rect x="132" y="200" width="52" height="24" rx="12" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="158" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Node</text><rect x="192" y="200" width="89" height="24" rx="12" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="236.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">WebSocket</text><rect x="289" y="200" width="66" height="24" rx="12" fill="#fb7185" fill-opacity=".10" stroke="#fb7185" stroke-opacity=".45"/><text x="322" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Canvas</text></g>
  <text x="532" y="254" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748b">★ 0  ·  TypeScript  ·  push hace 5 días</text>
</svg>
