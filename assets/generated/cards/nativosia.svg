<svg xmlns="http://www.w3.org/2000/svg" width="560" height="272" viewBox="0 0 560 272" role="img" aria-label="Nativosia">
  <defs>
    <linearGradient id="cnativosiabg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="cnativosiaedge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0"/><stop offset=".5" stop-color="#60a5fa"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="cnativosiaglow" cx="1" cy="0" r=".9"><stop offset="0" stop-color="#60a5fa" stop-opacity=".22"/><stop offset="1" stop-color="#60a5fa" stop-opacity="0"/></radialGradient>
    <filter id="cnativosian"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>@keyframes cnativosiain{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}} .cnativosiaa{animation:cnativosiain .8s ease-out both} .cnativosiab{animation:cnativosiain .8s ease-out .2s both} .cnativosiac{animation:cnativosiain .8s ease-out .4s both}</style>
  </defs>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cnativosiabg)" stroke="#1e293b"/>
  <rect x="1" y="1" width="558" height="270" rx="16" fill="url(#cnativosiaglow)"/>
  <rect x="24" y="1" width="512" height="2" fill="url(#cnativosiaedge)"/>
  <g transform="translate(28 26)"><g class="cnativosiaa" filter="url(#cnativosian)"><g fill="none" stroke="#60a5fa" stroke-width="2"><rect x="8" y="14" width="32" height="24" rx="8"/><circle cx="18" cy="26" r="3" fill="#60a5fa"/><circle cx="30" cy="26" r="3" fill="#60a5fa"/><path d="M24 14 V6 M20 6 H28 M4 24 V30 M44 24 V30"/></g></g></g>
  <g class="cnativosiaa">
    <text x="92" y="52" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="26" font-weight="800" fill="#f8fafc">Nativosia</text>
    <text x="92" y="74" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#60a5fa">Blog de IA automatizado con agentes</text>
  </g>
  <rect x="460.4" y="28" width="71.6" height="22" rx="11" fill="#60a5fa" fill-opacity=".14" stroke="#60a5fa" stroke-opacity=".6"/>
  <text x="496.2" y="43" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="10.5" font-weight="700" letter-spacing="1" fill="#60a5fa">ACTIVO</text>
  <g class="cnativosiab" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cbd5e1">
    <text x="28" y="110">Agentes autónomos investigan noticias y generan y publican posts</text>
    <text x="28" y="131">sobre IA para familias y docentes, con newsletter, redes</text>
    <text x="28" y="152">sociales y recursos para el aula.</text>
  </g>
  <g class="cnativosiac"><rect x="28" y="200" width="96" height="24" rx="12" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/><text x="76" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Agentes IA</text><rect x="132" y="200" width="96" height="24" rx="12" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/><text x="180" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Claude API</text><rect x="236" y="200" width="89" height="24" rx="12" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/><text x="280.5" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">WordPress</text><rect x="333" y="200" width="126" height="24" rx="12" fill="#60a5fa" fill-opacity=".10" stroke="#60a5fa" stroke-opacity=".45"/><text x="396" y="216" text-anchor="middle" font-size="12" fill="#cbd5e1" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace">Automatización</text></g>
  <text x="532" y="254" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#64748b"></text>
</svg>
