<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Trayectoria: Universidad de Cantabria, ERZIA, ZIV Automation, Anuvu e IES Ataúlfo Argenta">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset="1" stop-color="#05070f"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#94a3b8"/><stop offset=".3" stop-color="#60a5fa"/><stop offset=".55" stop-color="#f59e0b"/><stop offset=".78" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="n"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      @keyframes draw{from{stroke-dashoffset:1100}to{stroke-dashoffset:0}}
      @keyframes pop{0%{opacity:0;transform:scale(0)}70%{transform:scale(1.25)}100%{opacity:1;transform:scale(1)}}
      @keyframes fade{from{opacity:0}to{opacity:1}}
      @keyframes ping{0%{r:13;opacity:.9}100%{r:30;opacity:0}}
      @keyframes comet{from{transform:translateX(0)}to{transform:translateX(840px)}}
      .draw{stroke-dasharray:1100;animation:draw 2.4s ease-in-out both}
      .pop{animation:pop .6s ease-out both}
      .fade{animation:fade .8s ease-out both}
      .ping{animation:ping 1.8s ease-out 3s infinite}
      .comet{animation:comet 5s linear 2.6s infinite}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="328" rx="18" fill="url(#bg)" stroke="#1e293b"/>
  <text x="32" y="30" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="11" fill="#22d3ee" letter-spacing="2">// QUEST LOG · DEL LABORATORIO DE RF AL AULA</text>
  <line x1="180" x2="1020" y1="150" y2="150" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
  <line class="draw" x1="180" x2="1020" y1="150" y2="150" stroke="url(#line)" stroke-width="4" stroke-linecap="round" filter="url(#n)"/>
  <circle class="comet" cx="180" cy="150" r="3" fill="#fff" filter="url(#n)" opacity=".9"/>
  <g class="pop" style="animation-delay:0.35s;transform-origin:180px 150px">
    <circle cx="180" cy="150" r="10" fill="#05070f" stroke="#94a3b8" stroke-width="3" filter="url(#n)"/>
    <circle cx="180" cy="150" r="4" fill="#94a3b8"/>
    
  </g>
  <g class="fade" style="animation-delay:0.50s" text-anchor="middle">
    <text x="180" y="54" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#94a3b8" letter-spacing="1">2012–2020</text>
    <text x="180" y="76" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Ingeniería de Telecomunicaciones</text>
    <text x="180" y="96" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Universidad de Cantabria</text>
    <text x="180" y="114" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">Grado, máster e investigación MIMO-UWB</text>
  </g>
  <line class="fade" style="animation-delay:0.35s" x1="180" x2="180" y1="136" y2="120" stroke="#94a3b8" stroke-opacity=".5" stroke-dasharray="2 3"/>
<g class="pop" style="animation-delay:0.80s;transform-origin:390px 150px">
    <circle cx="390" cy="150" r="10" fill="#05070f" stroke="#60a5fa" stroke-width="3" filter="url(#n)"/>
    <circle cx="390" cy="150" r="4" fill="#60a5fa"/>
    
  </g>
  <g class="fade" style="animation-delay:0.95s" text-anchor="middle">
    <text x="390" y="214" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#60a5fa" letter-spacing="1">2017–2018</text>
    <text x="390" y="236" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Ingeniero RF y Microondas</text>
    <text x="390" y="256" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">ERZIA Technologies</text>
    <text x="390" y="274" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">Amplificadores y componentes de microondas</text>
  </g>
  <line class="fade" style="animation-delay:0.80s" x1="390" x2="390" y1="164" y2="190" stroke="#60a5fa" stroke-opacity=".5" stroke-dasharray="2 3"/>
<g class="pop" style="animation-delay:1.25s;transform-origin:600px 150px">
    <circle cx="600" cy="150" r="10" fill="#05070f" stroke="#f59e0b" stroke-width="3" filter="url(#n)"/>
    <circle cx="600" cy="150" r="4" fill="#f59e0b"/>
    
  </g>
  <g class="fade" style="animation-delay:1.40s" text-anchor="middle">
    <text x="600" y="54" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#f59e0b" letter-spacing="1">2021–2022</text>
    <text x="600" y="76" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Ingeniero de Aplicación</text>
    <text x="600" y="96" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">ZIV Automation</text>
    <text x="600" y="114" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">Comunicaciones para smart grids · IEC 61850</text>
  </g>
  <line class="fade" style="animation-delay:1.25s" x1="600" x2="600" y1="136" y2="120" stroke="#f59e0b" stroke-opacity=".5" stroke-dasharray="2 3"/>
<g class="pop" style="animation-delay:1.70s;transform-origin:810px 150px">
    <circle cx="810" cy="150" r="10" fill="#05070f" stroke="#a78bfa" stroke-width="3" filter="url(#n)"/>
    <circle cx="810" cy="150" r="4" fill="#a78bfa"/>
    
  </g>
  <g class="fade" style="animation-delay:1.85s" text-anchor="middle">
    <text x="810" y="214" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#a78bfa" letter-spacing="1">2022–2023</text>
    <text x="810" y="236" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Operador de Redes Satelitales</text>
    <text x="810" y="256" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">Anuvu</text>
    <text x="810" y="274" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">VSAT y Starlink para transporte marítimo 24/7</text>
  </g>
  <line class="fade" style="animation-delay:1.70s" x1="810" x2="810" y1="164" y2="190" stroke="#a78bfa" stroke-opacity=".5" stroke-dasharray="2 3"/>
<g class="pop" style="animation-delay:2.15s;transform-origin:1020px 150px">
    <circle cx="1020" cy="150" r="13" fill="#05070f" stroke="#22d3ee" stroke-width="3" filter="url(#n)"/>
    <circle cx="1020" cy="150" r="4" fill="#22d3ee"/>
    <circle class="ping" cx="1020" cy="150" r="13" fill="none" stroke="#22d3ee" stroke-width="2"/>
  </g>
  <g class="fade" style="animation-delay:2.30s" text-anchor="middle">
    <text x="1020" y="54" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="12.5" fill="#22d3ee" letter-spacing="1">2023 → hoy  ● ACTIVO</text>
    <text x="1020" y="76" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">Docente de FP · IA y Big Data</text>
    <text x="1020" y="96" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="13.5" fill="#cbd5e1">IES Ataúlfo Argenta</text>
    <text x="1020" y="114" font-family="'Segoe UI','Inter',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="11.5" fill="#64748b">DAM, DAW, SMR y CE en IA · Tutor FEM</text>
  </g>
  <line class="fade" style="animation-delay:2.15s" x1="1020" x2="1020" y1="136" y2="120" stroke="#22d3ee" stroke-opacity=".5" stroke-dasharray="2 3"/>
</svg>
